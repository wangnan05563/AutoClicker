# SonarQube 扫描配置（AutoClicker）
sonar.projectKey=AutoClicker
sonar.projectName=AutoClicker
sonar.projectVersion=2.0.2

sonar.sources=auto_clicker_py3.py,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
# 使用扫描器自带 JRE，避免与并行扫描争抢 JRE 下载缓存
sonar.scanner.skipJreProvisioning=true
# 跳过 Windows 系统证书库加载，避免扫描器在证书遍历上长时间阻塞
sonar.scanner.skipSystemTruststore=true

# 排除虚拟环境、构建产物、文档与助手工作目录
sonar.exclusions=**/.venv/**,**/release/**,**/.trae/**,**/.workbuddy*/**,**/docs/**,**/*.spec,**/*.bat,**/*.ps1,**/__pycache__/**
